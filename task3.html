<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        button{
            border-radius: 50%;
            font-size: 30px;
            width: 75px;
            height: 75px;
        }
        .btn:hover{
                color:aqua;
            }
           
        
    </style>
</head>
<body>
    <fieldset style="width:80px;margin: auto;border-radius: 15px;background-color: black;">
    <fieldset style="width: 300px;border-radius: 15px;background-color: white;">
        <p style="font-size: 30px;text-align: center;background-color: white;">Welcome to Calculator</p>
    </fieldset>
    <p style="text-align: end;font-size: 30px;color: white;">0</p>
   
        <button class="btn">AC</button> 
        <button style="background-color: rgb(118, 119, 122);">&#11013;</button> 
        <button style="background-color: rgb(118, 119, 122);">%</button> 
        <button style="background-color: orange;">&divide;</button>
    <br><br>
   
        <button style="background-color: rgb(66, 61, 61);">7</button> 
        <button style="background-color: rgb(66, 61, 61);">8</button> 
        <button style="background-color: rgb(66, 61, 61);">9</button> 
        <button style="background-color: orange;">&times;</button><br><br>
    <button style="background-color: rgb(66, 61, 61);">4</button> 
    <button style="background-color: rgb(66, 61, 61);">5</button> 
    <button style="background-color: rgb(66, 61, 61);">6</button> 
    <button style="background-color: orange;">&minus;</button><br><br>
    <button style="background-color: rgb(66, 61, 61);">1</button> 
    <button style="background-color: rgb(66, 61, 61);">2</button>
    <button style="background-color: rgb(66, 61, 61);">3</button> 
    <button style="background-color: orange;">+</button><br><br>
    <button style="background-color: rgb(66, 61, 61);">0</button> 
    <button style="background-color: rgb(66, 61, 61);">00</button> 
    <button style="background-color: rgb(66, 61, 61);">.</button> 
    <button style="background-color: orange;">=</button>
    
    </fieldset>
    
</body>
</html>
