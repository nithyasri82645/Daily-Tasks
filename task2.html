<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        label{
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1><br><br>
    <label>Roll no. :</label>
    <input type="number" style="width: 650px;" ><br><br>
    <label>Student name :</label>
    <input type="text" placeholder="First Name" style="width: 315px;"> - <input type="text" placeholder="Last name" style="width: 315px;"><br><br>
    <label>Father's name :</label>
    <input type="text" style="width: 650px;"><br><br>
    <label>Date of birth :</label>
    <select style="width:175px;">
        <option>Day</option>
        <option>Sunday</option>
        <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option>
    </select>
      &nbsp;<select style="width:175px;">
        <option>Month</option>
        <option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option>
        <option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option>
    </select>
      &nbsp;<select style="width:175px;">
        <option>Year</option><option>2026</option><option>2025</option>
        <option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option>
        <option>2018</option><option>2017</option><option>2016</option><option>2015</option><option>2014</option><option>2013</option>
        <option>2012</option><option>2011</option><option>2010</option><option>2009</option><option>2008</option><option>2007</option>
        <option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option><option>2001</option>
    </select> (DD-MM-YYYY)<BR><BR>
    <label>Mobile no. :</label><input type="text" value="+91" style="width: 40px;"> - <input type="number" style="width: 595px;"><br><br>
    <label>Email id :</label><input type="email" style="width: 655px;"><br><br>
    <label>Password :</label><input type="password" style="width: 655px;"><br><br>
    <label>Gender :</label><input type="radio" name="gender"><label> Male </label><input type="radio" name="gender"><label>Female</label><br><br>
    <label>Department :</label>
    <input type="checkbox" name="department"><label>CSE</label><input type="checkbox" name="department"><label>IT</label>
    <input type="checkbox" name="department"><label>ECE</label><input type="checkbox" name="department"><label>Civil</label>
    <input type="checkbox" name="department"><label>Mech</label><br><br>
    <label>Course :</label>
    <select>
        <option> -------------------------------------------------------- Select Current Course ---------------------------------------------------------</option>
    </select><br><br>
    <label>Student Photo :</label>
    <button>Choose File</button> No file chosen<br><br>
    <label>City :</label><input type="text" style="width: 660px;"><br><br>
    <label>Address :</label><textarea style="width: 660px; height: 80px;"></textarea>

    
</body>
</html>
