<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://kit.fontawesome.com/eb9efcbc38.js" crossorigin="anonymous"></script>
</head>
<style>
    label{
        display: inline-block;
        width: 300px;
    }
</style>
<body>
    <img src="logo.png" width="150px;" style="display:block; margin: auto;">

<div class="signup">
    <h1>Sign up</h1><br><br>
    <h1>Create a New Account</h1><br><br>
    <label><i class="fas fa-phone"></i>Mobile No. :</label>
    <input type="tel" placeholder="Enter your Mobile Number (i.e.987654310)" style="width: 300px;"><br><br>
    <label>&nbsp; &nbsp; &nbsp;<i class="fas fa-lock"></i>Set a Password :</label>
    <input type="password" placeholder="Enter your Password" style="width: 300px;"><br><br>
    <label>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <i class="fas fa-lock"></i>Confirm New Password :</label>
    <input type="password" placeholder="Confirm your password" style="width: 300px;"><br><br><br><br>
    <a class="bgc" href="http://127.0.0.1:5500/MilesAway/submitsignup.html">Submit</a><br><br><br>
    <a class="bgc" href="http://127.0.0.1:5500/MilesAway/home.html">Go back to Home</a>
</div>


    
</body>
</html>
